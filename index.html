<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhavya Mishra</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .hero-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -2;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .maintenance-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      max-width: 700px;
      padding: 20px;
    }

    .maintenance-content h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .maintenance-content p {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .maintenance-content a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    .maintenance-content a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- HERO SECTION (ACTIVE) -->
  <section class="hero">
    <video autoplay muted loop playsinline class="hero-video">
      <source src="bcVidStar1.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <div class="hero-overlay"></div>

    <div class="maintenance-content">
      <h1>🚧 Website Under Maintenance</h1>
      <p>
        Website is under maintainance with latest updates and much more.
        Please visit again soon or email the owner directly with any question:
      </p>
      <p>
        <a href="mailto:bmishra01@manhattan.edu">bmishra01@manhattan.edu</a>
      </p>
    </div>
  </section>

 

</body>
</html>
